name: build
on: [push, pull_request]
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version-file: ".python-version"
    - name: Install uv
      uses: astral-sh/setup-uv@v6
      with:
        enable-cache: true
    - name: Install dependencies
      run: uv sync --dev
    - name: Check linting with Ruff
      run: |
        uv run ruff --version
        uv run ruff check
    - name: Check formatting with Ruff
      run: uv run ruff format --check
  unit:
    runs-on: ubuntu-latest
    services:
      db:
        image: mariadb:latest
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: dmoj
          MYSQL_USER: dmoj
          MYSQL_PASSWORD: dmoj
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -u root -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=3
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version-file: ".python-version"
    - name: Install uv
      uses: astral-sh/setup-uv@v6
      with:
        enable-cache: true
    - name: Install dependencies
      run: |
        uv sync --extra test
        cp .env.ci .env
    - name: Wait for MariaDB
      run: |
        timeout 60s bash -c 'until mysql -h 127.0.0.1 -u root -proot -e "SELECT 1"; do sleep 1; done'
    - name: Setup database
      run: |
        mysql -h 127.0.0.1 -u root -proot -e "CREATE DATABASE IF NOT EXISTS dmoj DEFAULT CHARACTER SET utf8mb4 DEFAULT COLLATE utf8mb4_general_ci;"
        mysql -h 127.0.0.1 -u root -proot -e "GRANT ALL PRIVILEGES ON dmoj.* TO 'dmoj'@'%' IDENTIFIED BY 'dmoj';"
        mysql -h 127.0.0.1 -u root -proot -e "FLUSH PRIVILEGES;"
    - name: Run migrations
      run: uv run python manage.py migrate --noinput
    - name: Run unit tests
      run: uv run coverage run --source=. manage.py test judge
    - name: Generate coverage report
      run: uv run coverage xml
    - uses: codecov/codecov-action@v4
  styles:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install npm packages
        run: npm install -g sass postcss-cli postcss autoprefixer
      - name: Build style.css
        run: ./make_style.sh
