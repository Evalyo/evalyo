name: build
on: [push, pull_request]
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version-file: ".python-version"
    - name: Install uv
      uses: astral-sh/setup-uv@v6
      with:
        enable-cache: true
    - name: Install dependencies
      run: uv sync --dev
    - name: Check linting with Ruff
      run: |
        ruff --version
        ruff check
    - name: Check formatting with Ruff
      run: ruff format --check
  unit:
    runs-on: ubuntu-latest
    services:
      db:
        image: mariadb:latest
        env:
          MYSQL_ROOT_PASSWORD: <mariadb user password>
          MYSQL_DATABASE: dmoj
          MYSQL_USER: dmoj
          MYSQL_PASSWORD: <mariadb user password>
        ports:
          - 3306:3306
        options: >
          --health-cmd="mysqladmin ping -h localhost"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=3
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version-file: ".python-version"
    - name: Install uv
      uses: astral-sh/setup-uv@v6
      with:
        enable-cache: true
    - name: Install dependencies
      run: |
        uv sync --extra test
        cp .env.ci .env
    - name: Setup database
      run: |
        sudo mysql -e "CREATE DATABASE dmoj DEFAULT CHARACTER SET utf8mb4 DEFAULT COLLATE utf8mb4_general_ci;"
        sudo mysql -e "GRANT ALL PRIVILEGES ON dmoj.* TO 'dmoj'@'localhost' IDENTIFIED BY '<mariadb user password>';"
        mariadb-tzinfo-to-sql /usr/share/zoneinfo | sudo mariadb -u root mysql
    - name: Run unit tests
      run: coverage run --source=. manage.py test judge
    - name: Generate coverage report
      run: coverage xml
    - uses: codecov/codecov-action@v4
  styles:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install npm packages
        run: npm install -g sass postcss-cli postcss autoprefixer
      - name: Build style.css
        run: ./make_style.sh
