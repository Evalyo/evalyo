name: build
on: [push, pull_request]
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version-file: ".python-version"
    - name: Install uv
      uses: astral-sh/setup-uv@v6
      with:
        enable-cache: true
    - name: Install dependencies
      run: uv sync --dev
    - name: Check linting with Ruff
      run: |
        uv run ruff --version
        uv run ruff check
    - name: Check formatting with Ruff
      run: uv run ruff format --check
  unit:
    runs-on: ubuntu-latest
    services:
      db:
        image: mariadb:latest
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: dmoj
          MYSQL_USER: dmoj
          MYSQL_PASSWORD: dmoj
          MYSQL_ALLOW_EMPTY_PASSWORD: false
          MYSQL_RANDOM_ROOT_PASSWORD: false
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost"
          --health-interval=10s
          --health-timeout=10s
          --health-retries=5
          --health-start-period=30s
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version-file: ".python-version"
    - name: Install uv
      uses: astral-sh/setup-uv@v6
      with:
        enable-cache: true
    - name: Install dependencies
      run: |
        uv sync --extra test
        cp .env.ci .env
    - name: Install MySQL client
      run: |
        sudo apt-get update
        sudo apt-get install -y mysql-client-core-8.0
    - name: Wait for MariaDB
      run: |
        echo "Waiting for MariaDB to be ready..."
        for i in {1..30}; do
          if mysql -h 127.0.0.1 -P 3306 -u root -proot -e "SELECT 1" >/dev/null 2>&1; then
            echo "MariaDB is ready!"
            break
          fi
          echo "Attempt $i: MariaDB not ready yet, waiting..."
          sleep 2
        done
        mysql -h 127.0.0.1 -P 3306 -u root -proot -e "SELECT VERSION();"
    - name: Setup database
      run: |
        echo "Setting up database and user..."
        mysql -h 127.0.0.1 -P 3306 -u root -proot -e "CREATE DATABASE IF NOT EXISTS dmoj DEFAULT CHARACTER SET utf8mb4 DEFAULT COLLATE utf8mb4_general_ci;"
        mysql -h 127.0.0.1 -P 3306 -u root -proot -e "CREATE USER IF NOT EXISTS 'dmoj'@'%' IDENTIFIED BY 'dmoj';"
        mysql -h 127.0.0.1 -P 3306 -u root -proot -e "GRANT ALL PRIVILEGES ON dmoj.* TO 'dmoj'@'%';"
        mysql -h 127.0.0.1 -P 3306 -u root -proot -e "FLUSH PRIVILEGES;"
        echo "Database setup completed successfully!"
        mysql -h 127.0.0.1 -P 3306 -u root -proot -e "SHOW DATABASES;"
    - name: Run migrations
      run: uv run python manage.py migrate --noinput
    - name: Test database connection
      run: |
        uv run python manage.py shell -c "
        from django.db import connection
        cursor = connection.cursor()
        cursor.execute('SELECT VERSION()')
        print('Database connection successful!')
        print('MariaDB version:', cursor.fetchone()[0])
        "
    - name: Run unit tests
      run: uv run coverage run --source=. manage.py test judge
    - name: Generate coverage report
      run: uv run coverage xml
    - uses: codecov/codecov-action@v4
  styles:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install npm packages
        run: npm install -g sass postcss-cli postcss autoprefixer
      - name: Build style.css
        run: ./make_style.sh
